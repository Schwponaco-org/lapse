name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ORT_VERSION: 1.28.0

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            ort: linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            ort: linux-aarch64
          - name: macos-arm64
            os: macos-14
            ort: osx-arm64
            deployment: '11.0'
          - name: macos-x86_64
            os: macos-15-intel
            ort: osx-x86_64
            ort_version: '1.22.0'
            deployment: '10.15'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf automake libtool \
              pkg-config nasm yasm zlib1g-dev
          else
            for pkg in nasm automake autoconf libtool pkg-config; do
              brew list --formula "$pkg" > /dev/null 2>&1 || brew install "$pkg"
            done
          fi

      - name: Build FFmpeg, FFTW and libfvad
        run: |
          .github/scripts/build-ffmpeg.sh "$HOME/deps"
          .github/scripts/build-fftw.sh "$HOME/deps"
          .github/scripts/build-libfvad.sh "$HOME/deps"

      - name: Build lapse
        run: .github/scripts/build-lapse.sh "$HOME/deps" stage/lapse

      - name: Check it works with nothing beside it
        run: |
          stage/lapse --formats
          .github/scripts/smoke-engine.sh stage/lapse

      - name: Fetch onnxruntime and the Silero model
        run: |
          .github/scripts/fetch-onnxruntime.sh \
            ${{ matrix.ort }} "${{ matrix.ort_version || env.ORT_VERSION }}" stage

      - name: Check Silero is picked up now it is there
        run: |
          if [ "$(stage/lapse --vad)" != "silero" ]; then
            echo "onnxruntime was shipped but the binary did not load it"
            exit 1
          fi

      - name: Package
        run: |
          .github/scripts/package.sh lapse-${{ matrix.name }} stage dist
          cp stage/lapse dist/lapse-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: lapse-${{ matrix.name }}
          path: dist/*

  windows:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            msystem: MINGW64
            pkgprefix: mingw-w64-x86_64
            ort: win-x64
            cc: gcc
            cxx: g++
            windres: windres
          - name: windows-arm64
            os: windows-11-arm
            msystem: CLANGARM64
            pkgprefix: mingw-w64-clang-aarch64
            ort: win-arm64
            cc: clang
            cxx: clang++
            windres: llvm-windres
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      WINDRES: ${{ matrix.windres }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel git make diffutils curl tar xz zip unzip nasm
            autoconf automake libtool
            ${{ matrix.pkgprefix }}-toolchain
            ${{ matrix.pkgprefix }}-zlib

      - name: Build FFmpeg, FFTW and libfvad
        run: |
          .github/scripts/build-ffmpeg.sh "$HOME/deps"
          .github/scripts/build-fftw.sh "$HOME/deps"
          .github/scripts/build-libfvad.sh "$HOME/deps"

      - name: Build lapse
        run: .github/scripts/build-lapse.sh "$HOME/deps" stage/lapse.exe

      - name: Check it works with nothing beside it
        run: |
          stage/lapse.exe --formats
          .github/scripts/smoke-engine.sh stage/lapse.exe

      - name: Check nothing outside Windows itself is linked in
        run: |
          dump=$(command -v objdump || command -v llvm-objdump || true)
          if [ -z "$dump" ]; then exit 0; fi
          "$dump" -p stage/lapse.exe | grep -i 'DLL Name'
          if "$dump" -p stage/lapse.exe | grep -iE 'DLL Name:.*(libgcc|libstdc|libc\+\+|libwinpthread|libfftw|msys-)'; then
            echo "the binary still needs a DLL from the build environment"
            exit 1
          fi

      - name: Fetch onnxruntime and the Silero model
        run: |
          .github/scripts/fetch-onnxruntime.sh \
            ${{ matrix.ort }} "${{ matrix.ort_version || env.ORT_VERSION }}" stage

      - name: Check Silero is picked up now it is there
        run: |
          if [ "$(stage/lapse.exe --vad)" != "silero" ]; then
            echo "onnxruntime was shipped but the binary did not load it"
            exit 1
          fi

      - name: Package
        run: |
          .github/scripts/package.sh lapse-${{ matrix.name }} stage dist
          cp stage/lapse.exe dist/lapse-${{ matrix.name }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lapse-${{ matrix.name }}
          path: dist/*

  release:
    needs: [unix, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          cd out
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
