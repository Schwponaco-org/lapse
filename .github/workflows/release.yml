name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            nasm yasm libfftw3-dev zlib1g-dev

      - name: Build FFmpeg 7.x static
        run: |
          wget -q https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          tar xf ffmpeg-7.1.tar.xz
          cd ffmpeg-7.1
          ./configure \
            --prefix=/opt/ffmpeg \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-everything \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-swresample \
            --enable-demuxer=matroska,mov,avi,mp4,ogg,wav,flac,aac \
            --enable-decoder=aac,ac3,eac3,mp3,flac,vorbis,opus,dca,truehd,pcm_s16le,pcm_s16be,pcm_s24le,pcm_f32le,pcm_f32be \
            --enable-parser=aac,mp3,flac,vorbis,opus,ac3 \
            --enable-protocol=file
          make -j$(nproc)
          sudo make install

      - name: Verify FFmpeg static build
        run: |
          for lib in libavformat libavcodec libavutil libswresample; do
            if [ ! -f "/opt/ffmpeg/lib/${lib}.a" ]; then
              echo "Missing /opt/ffmpeg/lib/${lib}.a — static FFmpeg build failed"
              exit 1
            fi
          done
          ls -la /opt/ffmpeg/lib/*.a

      - name: Build libfvad static
        run: |
          git clone https://github.com/dpirch/libfvad.git
          cd libfvad
          autoreconf -i
          ./configure --prefix=/opt/libfvad --enable-static --disable-shared
          make
          sudo make install

      - name: Fetch ONNX Runtime and the Silero model
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then ORT_ARCH=x64; else ORT_ARCH=aarch64; fi
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}.tgz
          tar xf onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}.tgz
          cp onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION} \
             libonnxruntime-linux-${{ matrix.arch }}.so
          wget -q -O silero_vad.onnx \
            https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx
          ls -la libonnxruntime-linux-${{ matrix.arch }}.so silero_vad.onnx
        env:
          ORT_VERSION: 1.28.0

      - name: Build lapse
        run: |
          cd engine
          g++ -O2 -std=c++20 \
            -I/opt/ffmpeg/include \
            -I/opt/libfvad/include \
            -o lapse-linux-${{ matrix.arch }} \
            main.cpp correlate.cpp decoder.cpp srt_parser.cpp write_subtitle.cpp silero.cpp \
            -static-libgcc -static-libstdc++ \
            /opt/ffmpeg/lib/libavformat.a \
            /opt/ffmpeg/lib/libavcodec.a \
            /opt/ffmpeg/lib/libswresample.a \
            /opt/ffmpeg/lib/libavutil.a \
            /opt/libfvad/lib/libfvad.a \
            -Wl,-Bstatic -lfftw3 -Wl,-Bdynamic \
            -lm -lpthread -lz -ldl

      - name: Check that the binary starts without onnxruntime beside it
        run: |
          cd engine
          ./lapse-linux-${{ matrix.arch }} --formats

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapse-linux-${{ matrix.arch }}
          path: |
            engine/lapse-linux-${{ matrix.arch }}
            libonnxruntime-linux-${{ matrix.arch }}.so
            silero_vad.onnx

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Collect files
        run: |
          mkdir -p out
          cp lapse-linux-amd64/engine/lapse-linux-amd64 out/
          cp lapse-linux-arm64/engine/lapse-linux-arm64 out/
          cp lapse-linux-amd64/libonnxruntime-linux-amd64.so out/
          cp lapse-linux-arm64/libonnxruntime-linux-arm64.so out/
          cp lapse-linux-amd64/silero_vad.onnx out/
          ls -la out
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/lapse-linux-amd64
            out/lapse-linux-arm64
            out/libonnxruntime-linux-amd64.so
            out/libonnxruntime-linux-arm64.so
            out/silero_vad.onnx
