name: CI
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ORT_VERSION: 1.28.0

jobs:
  unix:
    name: Release binary (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            ort: linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            ort: linux-aarch64
          - name: macos-arm64
            os: macos-14
            ort: osx-arm64
            deployment: '11.0'
          - name: macos-x86_64
            os: macos-15-intel
            ort: osx-x86_64
            ort_version: '1.22.0'
            deployment: '10.15'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake autoconf automake libtool \
              pkg-config nasm yasm zlib1g-dev
          else
            for pkg in cmake nasm automake autoconf libtool pkg-config; do
              brew list --formula "$pkg" > /dev/null 2>&1 || brew install "$pkg"
            done
          fi

      - name: Build FFmpeg, FFTW and libfvad
        run: |
          .github/scripts/build-ffmpeg.sh "$HOME/deps"
          .github/scripts/build-fftw.sh "$HOME/deps"
          .github/scripts/build-libfvad.sh "$HOME/deps"

      - name: Build lapse
        run: |
          cmake -B build -DLAPSE_DEPS_PREFIX="$HOME/deps" \
                -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/stage"
          cmake --build build -j

      - name: Test the binary with nothing beside it
        run: |
          stage/lapse --formats
          .github/scripts/smoke-engine.sh stage/lapse

      - name: Check it falls back to libfvad when onnxruntime is missing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          .github/scripts/smoke-fallback.sh stage/lapse

      - name: Check Silero is picked up when it is there
        run: |
          .github/scripts/fetch-onnxruntime.sh \
            ${{ matrix.ort }} "${{ matrix.ort_version || env.ORT_VERSION }}" stage
          if [ "$(stage/lapse --vad)" != "silero" ]; then
            echo "onnxruntime was shipped but the binary did not load it"
            exit 1
          fi

      - name: Does it actually sync things correctly
        if: runner.os == 'Linux'
        run: .github/scripts/accuracy.sh stage/lapse

      - name: Check the release archive builds
        run: .github/scripts/package.sh lapse-${{ matrix.name }} stage dist

      - uses: actions/upload-artifact@v4
        with:
          name: lapse-${{ matrix.name }}
          path: dist/*

  windows:
    name: Release binary (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            msystem: MINGW64
            pkgprefix: mingw-w64-x86_64
            ort: win-x64
            cc: gcc
            cxx: g++
            windres: windres
          - name: windows-arm64
            os: windows-11-arm
            msystem: CLANGARM64
            pkgprefix: mingw-w64-clang-aarch64
            ort: win-arm64
            cc: clang
            cxx: clang++
            windres: llvm-windres
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      WINDRES: ${{ matrix.windres }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel git make diffutils curl tar xz zip unzip nasm
            autoconf automake libtool
            ${{ matrix.pkgprefix }}-toolchain
            ${{ matrix.pkgprefix }}-zlib
            ${{ matrix.pkgprefix }}-cmake
            ${{ matrix.pkgprefix }}-ninja

      - name: Build FFmpeg, FFTW and libfvad
        run: |
          .github/scripts/build-ffmpeg.sh "$HOME/deps"
          .github/scripts/build-fftw.sh "$HOME/deps"
          .github/scripts/build-libfvad.sh "$HOME/deps"

      - name: Build lapse
        run: |
          cmake -B build -G Ninja \
                -DLAPSE_DEPS_PREFIX="$(cygpath -m "$HOME/deps")" \
                -DCMAKE_RC_COMPILER="$WINDRES" \
                -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$(cygpath -m "$PWD")/stage"
          cmake --build build -j

      - name: Test the binary with nothing beside it
        run: |
          stage/lapse.exe --formats
          .github/scripts/smoke-engine.sh stage/lapse.exe

      - name: Check nothing outside Windows itself is linked in
        run: |
          dump=$(command -v objdump || command -v llvm-objdump || true)
          if [ -z "$dump" ]; then exit 0; fi
          "$dump" -p stage/lapse.exe | grep -i 'DLL Name'
          if "$dump" -p stage/lapse.exe | grep -iE 'DLL Name:.*(libgcc|libstdc|libc\+\+|libwinpthread|libfftw|msys-)'; then
            echo "the binary still needs a DLL from the build environment"
            exit 1
          fi

      - name: Check Silero is picked up when it is there
        run: |
          .github/scripts/fetch-onnxruntime.sh \
            ${{ matrix.ort }} "${{ matrix.ort_version || env.ORT_VERSION }}" stage
          if [ "$(stage/lapse.exe --vad)" != "silero" ]; then
            echo "onnxruntime was shipped but the binary did not load it"
            exit 1
          fi

      - name: Check the release archive builds
        run: .github/scripts/package.sh lapse-${{ matrix.name }} stage dist

      - uses: actions/upload-artifact@v4
        with:
          name: lapse-${{ matrix.name }}
          path: dist/*

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for both platforms the release publishes
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lapse:ci
          cache-from: type=gha

      - name: Test the engine inside the image
        run: |
          docker run --rm --entrypoint /app/lapse lapse:ci --formats
          docker run --rm -v "$PWD/.github/scripts:/scripts:ro" --entrypoint /scripts/smoke-engine.sh lapse:ci /app/lapse

      - name: Test the watcher inside the image
        run: .github/scripts/smoke-docker.sh lapse:ci
