services:
  lapse:
    container_name: lapse
    image: ghcr.io/schwponaco-org/lapse:latest
    restart: always
    ulimits:
      core: 0
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data
      - /mnt/media:/media
    environment:
      - MEDIA_ROOT=/media
      - DB_PATH=/data/lapse.db
      - LAPSE_BIN=/app/lapse
      - PUID=1000
      - PGID=1000
      - MODE=auto
      - PENALTY=6
      - SCAN_INTERVAL=900
      - MIN_CONFIDENCE=0
      - MAX_ATTEMPTS=3
      - TIMEOUT=1800
      - POLLING=0
      - CACHE_DAYS=30
      - OUTPUT_SUFFIX=
      - NO_BACKUP=0
      - NO_SIDECAR=0
      - NO_EMBEDDED=0
      - NO_CACHE=0
      - FULL_SCAN=0
      - FORCE=0
      - STRICT=0
      - DRY_RUN=0
      - CONFIDENCE=
      - AUDIO_TRACK=
      - SUB_TRACK=
      - FPS=